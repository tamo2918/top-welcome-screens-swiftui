name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build native SwiftUI app
        run: |
          xcodebuild \
            -project WelcomeScreenGallery.xcodeproj \
            -scheme WelcomeScreenGallery \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run Swift tests
        shell: bash
        run: |
          simulator_id="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')"
          if [[ -z "$simulator_id" ]]; then
            echo "No available iPhone simulator runtime" >&2
            exit 1
          fi
          xcodebuild \
            -project WelcomeScreenGallery.xcodeproj \
            -scheme WelcomeScreenGallery \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            CODE_SIGNING_ALLOWED=NO \
            test

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Tools/WelcomeScreensMCP/pyproject.toml

      - name: Install MCP server
        run: python -m pip install --disable-pip-version-check -e Tools/WelcomeScreensMCP

      - name: Run catalog and MCP protocol tests
        run: python -m unittest discover -s Tools/WelcomeScreensMCP/tests -v

      - name: Exercise the stdio transport
        run: python Tools/WelcomeScreensMCP/scripts/stdio_smoke.py
